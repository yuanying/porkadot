# porkadot CI
#
# Runs the same `bundle exec rake test` as a laptop. The install tests replace
# the SSHKit backend with a recorder or stub Net::SSH.start, so nothing here
# reaches a node or a cluster. The sops tests are skipped when sops or
# age-keygen is missing, so both are installed before the tests run.
name: CI

on:
  push:
    branches: [master]
  pull_request:

# Running the tests writes nothing outside the runner.
permissions:
  contents: read

# A pull request that gets pushed to again drops its earlier run. Pushes to
# master are not cancelled: every commit on master should have its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Ruby is read from .ruby-version. Gemfile.lock is not committed, so
      # setup-ruby resolves the gems from the gemspec on each run and caches
      # them under the lockfile it generated.
      - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          bundler-cache: true
      # go install fetches the module at the version written here and checks
      # it against the Go checksum database, so the version is all there is
      # to pin and Renovate can raise it alone. The runner's Go fetches a
      # newer toolchain if a module asks for one.
      - name: Install sops and age-keygen
        env:
          # renovate: datasource=go depName=github.com/getsops/sops/v3
          SOPS_VERSION: v3.13.3
          # renovate: datasource=go depName=filippo.io/age
          AGE_VERSION: v1.3.2
        run: |
          go install "github.com/getsops/sops/v3/cmd/sops@${SOPS_VERSION}"
          go install "filippo.io/age/cmd/age-keygen@${AGE_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: bundle exec rake test
