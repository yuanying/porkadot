namespace: kube-system

resources:
- https://github.com/kubernetes-sigs/kube-storage-version-migrator/manifests/?ref=v0.0.5

images:
- name: REGISTRY/storage-version-migration-initializer:VERSION
  newName: asia.gcr.io/k8s-artifacts-prod/storage-migrator/storage-version-migration-initializer
  newTag: v0.0.5
- name: REGISTRY/storage-version-migration-migrator:VERSION
  newName: asia.gcr.io/k8s-artifacts-prod/storage-migrator/storage-version-migration-migrator
  newTag: v0.0.5
- name: REGISTRY/storage-version-migration-trigger:VERSION
  newName: asia.gcr.io/k8s-artifacts-prod/storage-migrator/storage-version-migration-trigger
  newTag: v0.0.5
patchesJson6902:
- target:
    group: apps
    version: v1
    kind: Deployment
    name: migrator
    namespace: kube-system
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/command/-
      value: --kubeconfig=/etc/migrator/kubeconfig
- target:
    group: apps
    version: v1
    kind: Deployment
    name: trigger
    namespace: kube-system
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/args
      value: ["--kubeconfig=/etc/migrator/kubeconfig"]
patchesStrategicMerge:
- |-
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: migrator
    namespace: NAMESPACE
  spec:
    template:
      spec:
        containers:
        - name: migrator
          volumeMounts:
          - mountPath: /etc/migrator
            name: kubeconfig
        volumes:
        - name: kubeconfig
          configMap:
            name: kubeconfig-in-cluster-latest
- |-
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: trigger
    namespace: NAMESPACE
  spec:
    template:
      spec:
        containers:
        - name: trigger
          volumeMounts:
          - mountPath: /etc/migrator
            name: kubeconfig
        volumes:
        - name: kubeconfig
          configMap:
            name: kubeconfig-in-cluster-latest
